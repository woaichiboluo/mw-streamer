# mw-streamer 全量配置字段字典
#
# 本文件是说明性文档，不是一条可运行的 Pipeline 拓扑：
# - 它在同一个文件中展示了两种 Input 的互斥字段和全部 Sink 类型。
# - downstream 中的占位 ID 不构成完整媒体拓扑。
# - 使用时请只复制实际需要的字段到 pipeline.toml。
#
# 所有 *_ms 字段的单位均为毫秒。省略可选字段时使用这里展示的默认值。

# =============================================================================
# 进程级日志配置，可整体省略
# 日志级别：off / trace / debug / info / warning / error / critical
# =============================================================================
[log]
level = "info" # 未单独覆盖模块的默认级别

[log.modules]
# 键是任意模块名，值是该模块的日志级别。
streamer = "info"
processor = "info"
zlm = "off"
srt = "off"
ffmpeg = "off"

[log.console]
color = true
level = "trace" # off 表示不创建控制台日志 Sink

[log.rotating_file]
path = "" # level 非 off 时必须非空
level = "off"
max_file_size = 10485760 # 字节；启用文件日志时必须大于 0
max_files = 5 # 启用文件日志时必须大于 0

[log.async]
enabled = false
queue_size = 8192 # 启用异步日志且存在输出 Sink 时必须大于 0
overflow = "overrun_oldest" # block / overrun_oldest

# =============================================================================
# 进程级 ZLToolKit 配置，可整体省略
# 线程数为 0 时由 ZLToolKit 按硬件并发数决定。
# =============================================================================
[zlm]
event_poller_threads = 0
work_threads = 0
enable_cpu_affinity = true

# =============================================================================
# Input 字段字典
# 实际配置只能选择一种 type，并删除另一种类型的字段。
# Input 固定输出 Packet，downstream 至少包含一个接收 Packet 的 Sink ID。
# =============================================================================
[input]
type = "zlm" # 必填：zlm / file
downstream = ["<packet-sink-id>"] # 必填，至少一个 Sink ID

# type = "zlm" 时必填；交给 ZLMediaKit 打开。
url = "rtsp://127.0.0.1/live/camera"

# type = "file" 时使用 path，并删除 url、player、reconnect_policy。
# File Input 全速读取；相对路径以实际 pipeline.toml 所在目录为基准。
path = "./input.mp4"

[input.player]
# 仅 type = "zlm" 使用。
connect_timeout_ms = 10000 # 范围：1..INT_MAX
media_timeout_ms = 5000 # 范围：1..INT_MAX
local_bind_ip = "" # 空表示不指定本地绑定 IP

[input.reconnect_policy]
# 仅 type = "zlm" 使用。
max_retries = -1 # 初次连接后的重试次数；-1 表示无限重试
min_delay_ms = 2000 # 必须大于 0
max_delay_ms = 60000 # 不得小于 min_delay_ms
delay_step_ms = 3000 # 必须大于 0

# =============================================================================
# 所有 [[sinks]] 的公共字段
#
# id               必填、非空、全局唯一。
# type             必填；见下面八种 Sink。
# downstream       可选，默认 []。非终端 Sink 至少一个，终端 Sink 必须为空。
# 消息通过 Pipeline::SendMessage() 按目标 Sink ID 投递，无需配置消息连接。
# =============================================================================

# -----------------------------------------------------------------------------
# Decoder Sink：Packet -> Frame，必须有媒体下游
# -----------------------------------------------------------------------------
[[sinks]]
id = "decoder"
type = "decoder"
downstream = ["<frame-sink-id>"]
cache_duration_ms = 0 # 只能为 0 或 1000..30000；File Input 下必须为 0
audio_decode_queue_capacity = 256 # 必须大于 0
video_decode_queue_capacity = 128 # 必须大于 0

[sinks.audio_decoder]
decoder_name = "" # 空表示由 FFmpeg 按输入 codec 选择默认解码器

[sinks.video_decoder]
decoder_name = "" # 空表示由 FFmpeg 按输入 codec 选择默认解码器
backend = "cuda" # cuda / software
device_index = 0 # CUDA 后端下必须非负

# -----------------------------------------------------------------------------
# Analysis Processor Sink：Frame -> 无，终端 Sink，无专属 TOML 字段
# 回调通过 ProcessorBindings::analysis 按 ID 注入；业务配置不写入 TOML。
# -----------------------------------------------------------------------------
[[sinks]]
id = "analysis"
type = "analysis_processor"
downstream = []

# -----------------------------------------------------------------------------
# Transform Processor Sink：Frame -> Frame，必须有媒体下游，无专属 TOML 字段
# 回调通过 ProcessorBindings::transform 按 ID 注入；业务配置不写入 TOML。
# -----------------------------------------------------------------------------
[[sinks]]
id = "transform"
type = "transform_processor"
downstream = ["<frame-sink-id>"]

# -----------------------------------------------------------------------------
# Frame Custom Sink：Frame -> 无，终端 Sink，无专属 TOML 字段
# 必须通过 ProcessorBindings::frame_custom_sinks 提供同 ID 的回调绑定。
# -----------------------------------------------------------------------------
[[sinks]]
id = "frame_custom"
type = "frame_custom"
downstream = []

# -----------------------------------------------------------------------------
# Packet Custom Sink：Packet -> 无，终端 Sink，无缓存线程
# 必须通过 ProcessorBindings::packet_custom_sinks 提供同 ID 的回调绑定。
# on_video_packet/on_audio_packet 借用 const AVPacket*，仅在回调期间有效。
# -----------------------------------------------------------------------------
[[sinks]]
id = "packet_custom"
type = "packet_custom"
downstream = []

# -----------------------------------------------------------------------------
# Synchronizer Sink：Frame -> Frame，必须有媒体下游
# -----------------------------------------------------------------------------
[[sinks]]
id = "synchronizer"
type = "synchronizer"
downstream = ["<frame-sink-id>"]
frame_queue_capacity = 128 # 必须大于 0
max_frame_lateness_ms = 100 # 必须非负；增加固定墙钟播放延迟
standby_timeout_ms = 500 # 必须非负；无视频后切换备播图的等待时间
standby_image_path = "" # 空表示使用内置 loading 图

# -----------------------------------------------------------------------------
# Encoder Sink：Frame -> Packet，必须有媒体下游
# -----------------------------------------------------------------------------
[[sinks]]
id = "encoder"
type = "encoder"
downstream = ["<packet-sink-id>"]
frame_queue_capacity = 256 # 必须大于 0
startup_packet_capacity = 256 # 必须大于 0

[sinks.audio_encoder]
encoder_name = "" # 空表示选择 FFmpeg 默认 AAC 编码器

[sinks.audio_encoder.properties]
# 任意 FFmpeg 音频编码器属性；键和值都必须是字符串。
b = "128k"

[sinks.video_encoder]
codec = "h264" # h264 / h265
# 空时 CUDA 帧选择 NVENC，Host 帧选择 FFmpeg 默认编码器。
encoder_name = ""
frame_rate = { num = 0, den = 1 } # num >= 0，den > 0

[sinks.video_encoder.properties]
# 任意 FFmpeg 视频编码器属性；键和值都必须是字符串。
b = "4M"
g = "50"
preset = "p4"

# -----------------------------------------------------------------------------
# Remux Sink：Packet -> 无，终端 Sink
# 每个节点只配置一个 target，不进行编解码。
# -----------------------------------------------------------------------------
[[sinks]]
id = "remux"
type = "remux"
downstream = []
# 必填：rtmp://、rtsp://、srt://，或 .mp4 / .m3u8 文件路径。
target = "./output.mp4"
packet_queue_capacity = 384 # 必须大于 0

[sinks.zlm.pusher]
connect_timeout_ms = 10000 # 范围：1..INT_MAX
local_bind_ip = "" # 空表示不指定本地绑定 IP

[sinks.zlm.muxer]
paced_sender_interval_ms = 0 # 范围：0..UINT32_MAX；0 表示禁用

[sinks.zlm.recording]
file_buffer_size = 65536 # 字节；范围：1..UINT32_MAX
hls_segment_duration_ms = 10000 # 范围：1..UINT32_MAX

# =============================================================================
# 静态拓扑规则摘要
#
# - 媒体边两端的 Packet/Frame 类型必须一致。
# - 每个 Sink 只能有一个媒体上游；允许 fan-out，不允许汇聚。
# - 所有 Sink 必须从 Input 可达，媒体拓扑不能有环。
# - downstream 引用的 Sink ID 必须存在。
# =============================================================================
